name: Validate Data

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run Tests
        run: npm test
      - name: Rebuild Index (Data Integrity Check)
        # index.json and the transformations/unattested shards are gitignored
        # build artifacts produced from public/data/transformations/ and
        # public/data/unattested.json. This step verifies the regeneration
        # succeeds; the artifacts themselves are generated fresh at deploy
        # time, not committed.
        run: npm run rebuild-index
      - name: Validate data schema
        run: npm run validate-data
      - name: Typecheck and build
        run: npm run build
      - name: Check phoneticEffects and tags style
        run: |
          npx tsx scripts/normalize-effects.ts --check
          npx tsx scripts/normalize-tags.ts --check
      - name: Validate Source Links
        run: npx tsx scripts/validate-links.ts
